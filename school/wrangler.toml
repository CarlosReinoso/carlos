name = "carlos-school"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# SQLite (Cloudflare D1): users, memberships, posts, comments, likes, follows, messages, notifications.
# Create it once with `npx wrangler d1 create school` and paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "school"
database_id = "714e447f-cde6-40fd-b116-1fb0dbe4ed9d"
migrations_dir = "migrations"

[vars]
# Owner account (ADMIN_EMAILS) runs the school and gets full access; set it in .dev.vars and the Cloudflare dashboard.
CANONICAL_HOST = "school.carlosreinoso.co.uk"
